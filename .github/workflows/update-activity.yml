name: Actualizar actividad del perfil
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - .github/workflows/update-activity.yml
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generar gráficas locales
        run: python3 scripts/update_activity.py
      - name: Guardar cambios
        run: |
          git add assets/activity-light.svg assets/activity-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Actualiza la actividad del perfil'
          git push
