<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160" role="img" aria-labelledby="title desc">
<title id="title">Soy Xavi</title>
<desc id="desc">Desarrollo full stack y soluciones blockchain. Ecommerce y CRM a medida.</desc>
<style>
.bg{fill:#f0f9ff}.title{fill:#0f172a}.text{fill:#334155}.accent{fill:#0e7490}.line{stroke:#0891b2;stroke-opacity:.3}
.cursor{animation:blink 1.2s step-end infinite}@keyframes blink{50%{opacity:0}}
@media(prefers-color-scheme:dark){.bg{fill:#101b27}.title{fill:#f0f6fc}.text{fill:#c9d1d9}.accent{fill:#22d3ee}}
@media(prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
<rect class="bg" width="800" height="160" rx="16"/>

<g transform="translate(0 -110)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<text class="title" x="400" y="168" font-size="43" font-weight="700">Soy Xavi<tspan class="accent cursor">_</tspan></text>
<text class="text" x="400" y="207" font-size="23">Desarrollo full stack y soluciones blockchain.</text>
<text class="accent" x="400" y="244" font-size="11" font-weight="600" letter-spacing="3">BLOCKCHAIN · ECOMMERCE · CRM</text>
</g></svg>